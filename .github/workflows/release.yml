# =============================================================
# release.yml — Pipeline de Release Automatico
#
# Responsabilidades:
#   · Validar mensagens de commit (Conventional Commits)
#   · Executar testes do backend e frontend
#   · Gerar versao semantica automaticamente via semantic-release
#   · Commitar package.json atualizado de volta na main
#   · Disparar deploy no Render via webhook APOS o commit de release
#
# Gatilho: push na branch main
#
# Fluxo critico de versao:
#   1. Push na main dispara este workflow
#   2. semantic-release calcula nova versao e atualiza package.json
#   3. @semantic-release/git commita package.json na main [skip ci]
#   4. Job deploy-render dispara o webhook do Render
#   5. Render faz build com o package.json ja atualizado
#   6. Vite le a versao correta e embute no bundle
#   7. UI exibe a versao correta
#
# Por que usar webhook em vez de auto-deploy do Render:
#   O Render detecta o push original (sem versao atualizada) e inicia
#   o build antes do commit do semantic-release. Com o webhook,
#   o deploy so ocorre apos o package.json estar correto na main.
# =============================================================

name: Release Automatico

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo dry-run (sem publicar release)'
        required: false
        default: 'false'
        type: boolean

# Garante que apenas um workflow de release rode por vez
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # JOB 1: Validacao de Commits
  # -----------------------------------------------------------
  validate-commits:
    name: Validar Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de tooling
        run: npm ci --ignore-scripts

      - name: Validar mensagens de commit
        run: |
          FROM_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$FROM_SHA" = "$ZERO_SHA" ] || [ -z "$FROM_SHA" ]; then
            FROM_SHA="HEAD~1"
          fi
          npx commitlint \
            --from "$FROM_SHA" \
            --to ${{ github.sha }} \
            --verbose
        env:
          FORCE_COLOR: '1'

  # -----------------------------------------------------------
  # JOB 2: Testes — Backend
  # -----------------------------------------------------------
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do backend
        run: rm -rf node_modules package-lock.json && npm install --no-package-lock

      - name: Executar testes
        run: npm run test:run
        env:
          NODE_ENV: test
          CI: true

  # -----------------------------------------------------------
  # JOB 3: Testes — Frontend
  # -----------------------------------------------------------
  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        run: rm -rf node_modules package-lock.json && npm install --no-package-lock

      - name: Executar testes
        run: npm run test:run
        env:
          CI: true

  # -----------------------------------------------------------
  # JOB 4: Release Semantico
  # Gera versao, commita package.json e cria GitHub Release
  # -----------------------------------------------------------
  release:
    name: Gerar Release
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout completo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Sem branch protection, o GITHUB_TOKEN padrao e suficiente para push.
          # Se reativar protecao no futuro, configure RELEASE_TOKEN (PAT com escopo repo)
          # em Settings > Secrets and variables > Actions.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de tooling
        run: npm ci --ignore-scripts

      - name: Executar semantic-release
        id: semantic
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Executando em modo DRY-RUN..."
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"

      - name: Resumo da release
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "## Nova Release Publicada" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Versao | v${{ steps.semantic.outputs.new_release_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Nenhuma release necessaria
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "## Nenhuma Nova Release" >> $GITHUB_STEP_SUMMARY
          echo "Nenhum commit do tipo feat ou fix foi encontrado desde a ultima release." >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------
  # JOB 5: Deploy no Render
  #
  # Dispara o deploy APOS o semantic-release commitar o package.json
  # atualizado de volta na main. Isso garante que o Render sempre
  # faz build com a versao correta no package.json.
  #
  # Configuracao necessaria:
  #   1. No Render: desative o auto-deploy do servico frontend
  #      (Settings > Build & Deploy > Auto-Deploy > Disable)
  #   2. Copie o Deploy Hook URL do Render
  #      (Settings > Build & Deploy > Deploy Hook)
  #   3. No GitHub: adicione como secret RENDER_DEPLOY_HOOK_URL
  #      (Settings > Secrets and variables > Actions > New secret)
  #
  # Se RENDER_DEPLOY_HOOK_URL nao estiver configurado, este job
  # e ignorado e o Render continua com auto-deploy normal.
  # -----------------------------------------------------------
  deploy-render:
    name: Deploy Render
    runs-on: ubuntu-latest
    needs: release
    # Executa apenas se uma nova release foi publicada
    # e o webhook estiver configurado
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Disparar deploy no Render via webhook
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Disparando deploy no Render para v${{ needs.release.outputs.new_release_version }}..."
          curl -s --fail-with-body \
            -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n"
          echo "Deploy disparado com sucesso."
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Resumo do deploy
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "## Deploy Disparado" >> $GITHUB_STEP_SUMMARY
          echo "Render iniciou o build com package.json v${{ needs.release.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
