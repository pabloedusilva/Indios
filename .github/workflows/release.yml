# =============================================================
# release.yml — Pipeline de Release Automatico
#
# Fluxo:
#   1. Push na main dispara o workflow
#   2. Testes passam
#   3. semantic-release calcula versao, cria tag e GitHub Release
#   4. Workflow atualiza package.json com a nova versao via git push
#   5. Webhook dispara o Render com o package.json ja atualizado
#   6. Vite le a versao correta no build
#   7. UI exibe a versao correta
# =============================================================

name: Release Automatico

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo dry-run (sem publicar release)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # JOB 1: Validacao de Commits
  # -----------------------------------------------------------
  validate-commits:
    name: Validar Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de tooling
        run: npm ci --ignore-scripts

      - name: Validar mensagens de commit
        run: |
          FROM_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$FROM_SHA" = "$ZERO_SHA" ] || [ -z "$FROM_SHA" ]; then
            FROM_SHA="HEAD~1"
          fi
          npx commitlint \
            --from "$FROM_SHA" \
            --to ${{ github.sha }} \
            --verbose
        env:
          FORCE_COLOR: '1'

  # -----------------------------------------------------------
  # JOB 2: Testes — Backend
  # -----------------------------------------------------------
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias do backend
        run: rm -rf node_modules package-lock.json && npm install --no-package-lock

      - name: Executar testes
        run: npm run test:run
        env:
          NODE_ENV: test
          CI: true

  # -----------------------------------------------------------
  # JOB 3: Testes — Frontend
  # -----------------------------------------------------------
  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        run: rm -rf node_modules package-lock.json && npm install --no-package-lock

      - name: Executar testes
        run: npm run test:run
        env:
          CI: true

  # -----------------------------------------------------------
  # JOB 4: Release Semantico
  # -----------------------------------------------------------
  release:
    name: Gerar Release
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout completo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Usa PAT se disponivel, senao usa GITHUB_TOKEN.
          # Para push em main sem protecao, GITHUB_TOKEN e suficiente.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias de tooling
        run: npm ci --ignore-scripts

      - name: Executar semantic-release
        id: semantic
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"

      # Atualiza package.json com a nova versao e faz push direto na main.
      # Este passo e necessario porque o @semantic-release/git pode falhar
      # silenciosamente quando o GITHUB_TOKEN nao tem permissao de push
      # apos um merge de PR. Este passo garante o push independentemente.
      - name: Atualizar package.json com nova versao
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          NEW_VERSION="${{ steps.semantic.outputs.new_release_version }}"
          echo "Atualizando package.json para versao $NEW_VERSION..."

          # Atualiza o campo version no package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json atualizado para', pkg.version);
          "

          # Configura git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Verifica se ha mudancas para commitar
          if git diff --quiet package.json; then
            echo "package.json ja esta na versao correta, nenhum commit necessario."
            exit 0
          fi

          # Commita e faz push
          git add package.json
          git commit -m "chore(release): atualiza package.json para v$NEW_VERSION [skip ci]"
          git push origin main
          echo "package.json atualizado e enviado para main com sucesso."

      - name: Resumo da release
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "## Nova Release Publicada" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Versao | v${{ steps.semantic.outputs.new_release_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY

      - name: Nenhuma release necessaria
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "## Nenhuma Nova Release" >> $GITHUB_STEP_SUMMARY
          echo "Nenhum commit do tipo feat ou fix encontrado desde a ultima release." >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------
  # JOB 5: Deploy no Render
  # Dispara APOS o package.json estar atualizado na main.
  #
  # Configuracao:
  #   1. Render: desative auto-deploy em Settings > Build & Deploy
  #   2. Render: copie o Deploy Hook URL em Settings > Build & Deploy
  #   3. GitHub: adicione secret RENDER_DEPLOY_HOOK_URL
  # -----------------------------------------------------------
  deploy-render:
    name: Deploy Render
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Disparar deploy no Render via webhook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL nao configurado — pulando deploy via webhook."
            exit 0
          fi
          echo "Disparando deploy no Render para v${{ needs.release.outputs.new_release_version }}..."
          curl -s --fail-with-body \
            -X POST \
            "$RENDER_DEPLOY_HOOK_URL" \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n"
          echo "Deploy disparado com sucesso."
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Resumo do deploy
        run: |
          echo "## Deploy Render" >> $GITHUB_STEP_SUMMARY
          echo "Versao: v${{ needs.release.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
