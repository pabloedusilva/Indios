# =============================================================
# release.yml — Pipeline de Release Automático
#
# Responsabilidades:
#   · Validar commits e executar testes antes de release
#   · Executar semantic-release para calcular versão e criar release
#   · Sincronizar versões entre todos os package.json do monorepo
#   · Criar tags Git e GitHub Releases automaticamente
#   · Disparar deploy em produção (Render)
#
# Gatilhos:
#   · push para branch main (automático)
#   · workflow_dispatch (manual com opção de dry-run)
#
# Fluxo Completo:
#   1. Validação de commits convencionais
#   2. Execução de testes (backend e frontend em paralelo)
#   3. semantic-release: análise, versionamento, CHANGELOG, tag, GitHub Release
#   4. Sincronização de package.json dos workspaces (frontend e backend)
#   5. Commit e push com [skip ci] para evitar loop
#   6. Deploy automático no Render
# =============================================================

name: Release Automático

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo dry-run (sem publicar release)'
        required: false
        default: 'false'
        type: boolean

# Previne execuções paralelas conflitantes
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: Validação de Commits
  # Valida que todos os commits seguem Conventional Commits
  # ============================================================
  validate-commits:
    name: Validar Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de tooling
        run: npm ci --ignore-scripts

      - name: Validar mensagens de commit
        run: |
          FROM_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$FROM_SHA" = "$ZERO_SHA" ] || [ -z "$FROM_SHA" ]; then
            FROM_SHA="HEAD~1"
          fi
          npx commitlint \
            --from "$FROM_SHA" \
            --to ${{ github.sha }} \
            --verbose
        env:
          FORCE_COLOR: '1'

      - name: Resumo da validação
        if: success()
        run: |
          echo "## ✅ Commits Validados" >> $GITHUB_STEP_SUMMARY
          echo "Todos os commits seguem Conventional Commits." >> $GITHUB_STEP_SUMMARY

      - name: Erro na validação
        if: failure()
        run: |
          echo "## ❌ Validação Falhou" >> $GITHUB_STEP_SUMMARY
          echo "Um ou mais commits não seguem o formato Conventional Commits." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Formato esperado:** \`<tipo>(<escopo>): <descrição>\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tipos válidos:** feat, fix, perf, revert, refactor, docs, test, build, ci, chore, style" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: Testes Backend
  # Executa suite de testes da API Node.js/Express
  # ============================================================
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        run: rm -rf node_modules package-lock.json && npm install --no-package-lock

      - name: Executar testes
        run: npm run test:run
        env:
          NODE_ENV: test
          CI: true

      - name: Resumo dos testes
        if: success()
        run: |
          echo "## ✅ Testes Backend Passaram" >> $GITHUB_STEP_SUMMARY

      - name: Erro nos testes
        if: failure()
        run: |
          echo "## ❌ Testes Backend Falharam" >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs acima para detalhes." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 3: Testes Frontend
  # Executa suite de testes React/Vite
  # ============================================================
  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: rm -rf node_modules package-lock.json && npm install --no-package-lock

      - name: Executar testes
        run: npm run test:run
        env:
          CI: true

      - name: Resumo dos testes
        if: success()
        run: |
          echo "## ✅ Testes Frontend Passaram" >> $GITHUB_STEP_SUMMARY

      - name: Erro nos testes
        if: failure()
        run: |
          echo "## ❌ Testes Frontend Falharam" >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs acima para detalhes." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 4: Release Semântico
  # Executa semantic-release e sincroniza workspaces
  # ============================================================
  release:
    name: Gerar Release
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    # Permissões mínimas necessárias
    permissions:
      contents: write        # Criar tags e fazer push
      issues: write          # Comentar em issues
      pull-requests: write   # Comentar em PRs

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout completo do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de tooling
        run: npm ci --ignore-scripts

      - name: Executar semantic-release
        id: semantic
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Executando em modo dry-run..."
            echo "⚠️ Nenhuma tag, release ou commit será criado."
            echo ""
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        continue-on-error: true

      - name: Verificar resultado do semantic-release
        if: steps.semantic.outcome == 'failure'
        run: |
          echo "::error::semantic-release falhou ao calcular próxima versão"
          echo "## ❌ Release Falhou" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Erro:** semantic-release não conseguiu determinar a próxima versão." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Possíveis causas:**" >> $GITHUB_STEP_SUMMARY
          echo "- Nenhum commit desde a última release que dispare bump (feat, fix, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- Mensagens de commit inválidas" >> $GITHUB_STEP_SUMMARY
          echo "- Configuração inválida em .releaserc.js" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Resumo do dry-run
        if: github.event.inputs.dry_run == 'true' && steps.semantic.outcome == 'success'
        run: |
          echo "## 🔍 Dry-Run Executado com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O semantic-release foi executado em modo dry-run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ Nenhuma ação foi tomada:**" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Nenhuma tag Git foi criada" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Nenhuma GitHub Release foi publicada" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Nenhum commit foi criado" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ CHANGELOG.md não foi atualizado" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ package.json não foram modificados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**📋 Verifique os logs acima para ver:**" >> $GITHUB_STEP_SUMMARY
          echo "- Qual seria a próxima versão calculada" >> $GITHUB_STEP_SUMMARY
          echo "- Quais commits seriam incluídos na release" >> $GITHUB_STEP_SUMMARY
          echo "- Como seriam as release notes geradas" >> $GITHUB_STEP_SUMMARY


      # Sincroniza versões entre todos os package.json do monorepo
      - name: Sincronizar versões dos workspaces
        if: steps.semantic.outputs.new_release_published == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          // =============================================================
          // Script de Sincronização de Workspaces
          //
          // Responsabilidades:
          //   · Ler última tag Git criada pelo semantic-release
          //   · Atualizar package.json raiz, frontend e backend
          //   · Preservar formatação JSON (2 espaços, newline final)
          //   · Validar sincronização bem-sucedida
          //   · Criar commit e push com [skip ci]
          //
          // Requirements: 2.2, 2.3, 2.4, 2.5, 2.6
          // =============================================================

          /**
           * Lê a última tag Git criada
           * @returns {string} Versão sem o prefixo 'v' (ex: "1.3.0")
           */
          function getLatestTagVersion() {
            try {
              const tag = execSync('git describe --tags --abbrev=0', { encoding: 'utf8' }).trim();
              const version = tag.replace(/^v/, '');
              console.log(`📌 Última tag Git: ${tag} → versão ${version}`);
              return version;
            } catch (error) {
              console.error('❌ Erro ao ler última tag Git:', error.message);
              process.exit(1);
            }
          }

          /**
           * Atualiza o campo version de um package.json preservando formatação
           * @param {string} filePath - Caminho do arquivo package.json
           * @param {string} newVersion - Nova versão a ser definida
           * @returns {boolean} true se atualizado, false se já estava na versão correta
           */
          function updatePackageJson(filePath, newVersion) {
            try {
              // Validar que arquivo existe
              if (!fs.existsSync(filePath)) {
                console.error(`❌ Arquivo não encontrado: ${filePath}`);
                process.exit(1);
              }

              // Ler conteúdo original
              const originalContent = fs.readFileSync(filePath, 'utf8');
              
              // Parsear JSON
              let pkg;
              try {
                pkg = JSON.parse(originalContent);
              } catch (parseError) {
                console.error(`❌ JSON inválido em ${filePath}:`, parseError.message);
                process.exit(1);
              }

              // Verificar se já está na versão correta
              if (pkg.version === newVersion) {
                console.log(`ℹ️  ${filePath} já está na versão ${newVersion}`);
                return false;
              }

              const oldVersion = pkg.version;
              
              // Atualizar versão
              pkg.version = newVersion;

              // Preservar formatação: 2 espaços de indentação + newline final
              const updatedContent = JSON.stringify(pkg, null, 2) + '\n';
              
              // Escrever arquivo
              fs.writeFileSync(filePath, updatedContent, 'utf8');
              
              console.log(`✅ ${filePath}: ${oldVersion} → ${newVersion}`);
              return true;
            } catch (error) {
              console.error(`❌ Erro ao atualizar ${filePath}:`, error.message);
              process.exit(1);
            }
          }

          /**
           * Valida que todos os package.json têm a mesma versão
           * @param {string} expectedVersion - Versão esperada
           * @returns {boolean} true se todos sincronizados
           */
          function validateSynchronization(expectedVersion) {
            const files = [
              'package.json',
              'backend/package.json',
              'frontend/package.json'
            ];

            console.log('\n📊 Validação de sincronização:');
            
            let allSynced = true;
            const versions = {};

            for (const file of files) {
              try {
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                versions[file] = pkg.version;
                
                const status = pkg.version === expectedVersion ? '✅' : '❌';
                console.log(`  ${status} ${file.padEnd(25)} → ${pkg.version}`);
                
                if (pkg.version !== expectedVersion) {
                  allSynced = false;
                }
              } catch (error) {
                console.error(`  ❌ ${file.padEnd(25)} → Erro: ${error.message}`);
                allSynced = false;
              }
            }

            return allSynced;
          }

          /**
           * Executa o processo completo de sincronização
           */
          function main() {
            console.log('🚀 Iniciando sincronização de workspaces...\n');

            // 1. Obter versão da última tag Git
            const latestVersion = getLatestTagVersion();

            // 2. Atualizar package.json raiz (já foi atualizado pelo semantic-release, mas verificamos)
            console.log('\n📦 Atualizando package.json dos workspaces:');
            const rootUpdated = updatePackageJson('package.json', latestVersion);

            // 3. Atualizar workspaces
            const backendUpdated = updatePackageJson('backend/package.json', latestVersion);
            const frontendUpdated = updatePackageJson('frontend/package.json', latestVersion);

            // 4. Validar sincronização
            const isValid = validateSynchronization(latestVersion);
            
            if (!isValid) {
              console.error('\n❌ ERRO: Versões desincronizadas após atualização!');
              process.exit(1);
            }

            console.log('\n✅ Todas as versões sincronizadas com sucesso!');

            // 5. Verificar se há mudanças para commitar
            const hasChanges = backendUpdated || frontendUpdated;
            
            if (!hasChanges) {
              console.log('\nℹ️  Nenhuma mudança para commitar (workspaces já estavam sincronizados)');
              return;
            }

            // 6. Configurar Git
            console.log('\n📝 Criando commit de sincronização...');
            execSync('git config user.name "github-actions[bot]"', { stdio: 'inherit' });
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"', { stdio: 'inherit' });

            // 7. Adicionar arquivos modificados
            execSync('git add backend/package.json frontend/package.json', { stdio: 'inherit' });

            // 8. Criar commit com [skip ci]
            const commitMessage = `chore(release): sincroniza workspaces para v${latestVersion} [skip ci]`;
            execSync(`git commit -m "${commitMessage}"`, { stdio: 'inherit' });

            // 9. Push para main
            console.log('\n🚀 Enviando mudanças para repositório remoto...');
            execSync('git push origin main', { stdio: 'inherit' });

            console.log('\n✅ Workspaces sincronizados e enviados para main com sucesso!');
          }

          // Executar script
          try {
            main();
          } catch (error) {
            console.error('\n❌ Erro fatal durante sincronização:', error.message);
            process.exit(1);
          }
          EOF

      - name: Resumo da release
        if: steps.semantic.outputs.new_release_published == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "## 🎉 Nova Release Publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão** | \`v${{ steps.semantic.outputs.new_release_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Artefatos Criados" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Git tag \`v${{ steps.semantic.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Release com release notes" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CHANGELOG.md atualizado" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ package.json sincronizados (raiz, frontend, backend)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Nota de atualização salva no banco de dados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Próximos Passos" >> $GITHUB_STEP_SUMMARY
          echo "- O modal de update notes será exibido automaticamente para os usuários" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy será disparado automaticamente no Render" >> $GITHUB_STEP_SUMMARY

      # Sincroniza release com banco de dados (tabela update_notes)
      - name: Sincronizar release com banco de dados
        if: steps.semantic.outputs.new_release_published == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "📡 Sincronizando release v${{ steps.semantic.outputs.new_release_version }} com banco de dados..."
          node backend/scripts/sync-release-to-db.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Erro na sincronização com banco
        if: steps.semantic.outputs.new_release_published == 'true' && failure()
        run: |
          echo "## ⚠️ Aviso: Sincronização com Banco Falhou" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A release foi criada com sucesso, mas não foi possível sincronizar com o banco de dados." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ação necessária:** Crie a nota manualmente via API ou SQL:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`sql" >> $GITHUB_STEP_SUMMARY
          echo "INSERT INTO update_notes (versao, tipo, titulo, descricao, melhorias, correcoes, ativo)" >> $GITHUB_STEP_SUMMARY
          echo "VALUES ('${{ steps.semantic.outputs.new_release_version }}', 'minor', 'Título', 'Descrição', JSON_ARRAY(), JSON_ARRAY(), 1);" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Nenhuma release necessária
        if: steps.semantic.outputs.new_release_published != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "## ℹ️ Nenhuma Nova Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nenhum commit do tipo \`feat\`, \`fix\`, \`perf\` ou \`revert\` encontrado desde a última release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Para disparar uma release, faça commits com um dos seguintes tipos:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat:\` → incrementa MINOR (1.0.0 → 1.1.0)" >> $GITHUB_STEP_SUMMARY
          echo "- \`fix:\` → incrementa PATCH (1.0.0 → 1.0.1)" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat!:\` ou \`BREAKING CHANGE:\` → incrementa MAJOR (1.0.0 → 2.0.0)" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 5: Deploy no Render
  # Dispara deploy em produção após release bem-sucedida
  # ============================================================
  deploy-render:
    name: Deploy Render
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new_release_published == 'true' && github.event.inputs.dry_run != 'true'

    steps:
      - name: Disparar deploy no Render via webhook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL não configurado — pulando deploy via webhook."
            echo "## ⚠️ Deploy Não Configurado" >> $GITHUB_STEP_SUMMARY
            echo "Configure o secret \`RENDER_DEPLOY_HOOK_URL\` para habilitar deploy automático." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "🚀 Disparando deploy no Render para v${{ needs.release.outputs.new_release_version }}..."
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deploy disparado com sucesso (HTTP $HTTP_CODE)"
          else
            echo "::error::Falha ao disparar deploy (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Resumo do deploy
        if: success()
        run: |
          echo "## 🚀 Deploy Disparado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Versão:** \`v${{ needs.release.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O deploy foi disparado no Render. Acompanhe o progresso no dashboard do Render." >> $GITHUB_STEP_SUMMARY

      - name: Erro no deploy
        if: failure()
        run: |
          echo "## ❌ Falha no Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Não foi possível disparar o deploy no Render." >> $GITHUB_STEP_SUMMARY
          echo "Verifique o secret \`RENDER_DEPLOY_HOOK_URL\` e tente novamente." >> $GITHUB_STEP_SUMMARY
